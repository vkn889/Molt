name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-copy.py
      - run: swift test
      - run: brew install create-dmg
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/package.sh "${TAG#v}"
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${TAG#v}.md"
          if [ ! -f "$notes" ]; then notes="$RUNNER_TEMP/notes.md"; echo "Molt ${TAG#v}" > "$notes"; fi
          echo "NOTES=$notes" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          body_path: ${{ env.NOTES }}
