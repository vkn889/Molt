name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-copy.py
      - run: swift test
      - run: brew install create-dmg
      # Developer ID signing and notarization, when the secrets exist (docs/distribution.md).
      # Without them the DMG is ad-hoc signed and Gatekeeper blocks it on other Macs.
      - name: Import Developer ID certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          if [ -z "$P12" ]; then echo "::warning::No Developer ID secrets; this release won't be notarized."; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/molt-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "MOLT_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          echo "MOLT_REQUIRE_NOTARIZATION=1" >> "$GITHUB_ENV"
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
          MOLT_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          MOLT_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./scripts/package.sh "${TAG#v}"
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8"
          if [ -f "$RUNNER_TEMP/molt-signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/molt-signing.keychain-db"; fi
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${TAG#v}.md"
          if [ ! -f "$notes" ]; then notes="$RUNNER_TEMP/notes.md"; echo "Molt ${TAG#v}" > "$notes"; fi
          echo "NOTES=$notes" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          body_path: ${{ env.NOTES }}
